# Cachet production stack. Aiven Runtime reads this file: it builds `app` from the
# Dockerfile and turns `db` (postgres image) and `cache` (valkey image) into managed
# Aiven for PostgreSQL and Aiven for Valkey, injecting DATABASE_URL and VALKEY_URL.
# Locally, `docker compose up` runs the same stack with plain containers.
services:
  app:
    build: .
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-app}@db:5432/app
      VALKEY_URL: redis://cache:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODEL: ${MODEL:-anthropic/claude-sonnet-5}
      SCORING_MODEL: ${SCORING_MODEL:-anthropic/claude-haiku-5-5}
      SCAN_EVERY_MIN: ${SCAN_EVERY_MIN:-30}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cache:
    image: valkey/valkey:8-alpine
    volumes:
      - cachedata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  cachedata:
